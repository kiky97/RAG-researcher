name: RAGLab application
on:
  push:
    paths: ['raglab/**', 'tests/**', 'requirements*.txt', '.github/workflows/raglab.yml']
  pull_request:
    paths: ['raglab/**', 'tests/**', 'requirements*.txt', '.github/workflows/raglab.yml']
jobs:
  offline-application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check raglab/static/app.js
